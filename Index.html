<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c26;--surface2:#1e2332;--border:#2a3040;
  --accent:#e8a83e;--accent2:#5b9cf0;--green:#44cc88;--red:#ff5555;--amber:#ffaa44;
  --text:#e8ecf4;--text2:#8a95a8;--text3:#5a6478;--radius:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%;}
#app{max-width:480px;margin:0 auto;padding:0 0 90px;}

/* HEADER */
.app-header{background:linear-gradient(160deg,#1a1f2e 0%,#0f1117 100%);padding:env(safe-area-inset-top,16px) 20px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.header-inner{padding:16px 0 0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.app-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--accent);letter-spacing:-0.5px;}
.app-subtitle{font-size:12px;color:var(--text2);font-weight:300;margin-bottom:12px;}
.alert-dot{background:var(--red);color:white;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}

/* NAV */
.nav-tabs{display:flex;gap:4px;padding:0 0 12px;}
.nav-tab{flex:1;padding:9px 4px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;background:var(--surface2);color:var(--text2);}
.nav-tab.active{background:var(--accent);color:#0f1117;font-weight:600;}

/* OVERVIEW */
.overview-strip{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;gap:8px;}
.ov-item{display:flex;flex-direction:column;align-items:center;min-width:fit-content;}
.ov-num{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--accent);}
.ov-label{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
.ov-divider{width:1px;height:28px;background:var(--border);flex-shrink:0;}

/* ALERTS */
.alerts-panel{margin:12px 16px;background:rgba(255,85,85,0.06);border:1px solid rgba(255,85,85,0.25);border-radius:var(--radius);padding:14px;}
.alerts-title{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.alert-item{font-size:13px;color:var(--text2);padding:4px 0;border-bottom:1px solid rgba(255,85,85,0.1);}
.alert-item:last-child{border-bottom:none;}

/* TODAY HERO */
.today-hero{margin:16px 16px 0;background:linear-gradient(135deg,#1e2640 0%,#182030 100%);border:1px solid #2a3550;border-radius:18px;padding:20px;position:relative;overflow:hidden;}
.today-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(232,168,62,0.12) 0%,transparent 70%);}
.today-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px;}
.today-city{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--text);line-height:1.1;margin-bottom:4px;}
.today-date{font-size:13px;color:var(--text2);margin-bottom:10px;}
.today-activity{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:14px;}

/* SECTION HEADER */
.section-header{padding:16px 20px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}

/* DAY CARDS */
.days-list{padding:10px 16px;display:flex;flex-direction:column;gap:10px;}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color 0.2s;}
.day-card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(232,168,62,0.2);}
.day-card.alert-card{border-color:var(--red);}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.day-number{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;}
.day-date-label{font-size:12px;color:var(--text2);}
.driving-badge{font-size:11px;background:rgba(91,156,240,0.15);color:var(--accent2);padding:2px 8px;border-radius:20px;margin-left:auto;}
.alert-badge{font-size:11px;background:rgba(255,85,85,0.15);color:var(--red);padding:2px 8px;border-radius:20px;}
.day-city{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;}
.day-activity-text{font-size:13px;color:var(--text2);line-height:1.4;}

/* EXPANDED */
.day-expanded{margin-top:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* WEATHER */
.weather-widget{background:rgba(91,156,240,0.08);border:1px solid rgba(91,156,240,0.2);border-radius:10px;padding:12px 14px;}
.weather-main{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.weather-temp{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--accent2);}
.weather-cond{font-size:13px;color:var(--text2);}
.weather-details{display:flex;gap:12px;font-size:12px;color:var(--text3);flex-wrap:wrap;}
.weather-loading{font-size:12px;color:var(--text3);padding:8px;background:rgba(91,156,240,0.05);border-radius:8px;text-align:center;}

/* TRAFFIC */
.traffic-widget{background:var(--surface2);border-left:3px solid var(--green);border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);}

/* INFO BLOCKS */
.info-grid{display:flex;flex-direction:column;gap:8px;}
.info-block{background:var(--surface2);border-radius:10px;padding:12px;}
.info-block.drive{border-left:3px solid var(--accent2);}
.info-block.stay{border-left:3px solid var(--accent);}
.info-block.notes-block{border-left:3px solid #7c5cbf;}
.info-block.fuel{border-left:3px solid var(--amber);}
.info-block.suggestion{border-left:3px solid var(--green);}
.info-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:5px;}
.info-value{font-size:13px;color:var(--text);line-height:1.5;}
.info-value.bold{font-weight:600;color:var(--accent);}
.info-value.small{font-size:12px;color:var(--text2);margin-top:2px;}
.info-ref{font-size:11px;color:var(--text3);margin-top:4px;font-family:monospace;}

/* MAP LINK */
.map-link{display:block;text-align:center;padding:10px;background:rgba(91,156,240,0.1);border:1px solid rgba(91,156,240,0.25);color:var(--accent2);border-radius:10px;font-size:13px;font-weight:500;text-decoration:none;}

/* POI / EVENTS */
.expand-btn{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-align:left;}
.expand-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.expand-item{background:var(--surface2);border-radius:8px;padding:10px 12px;}
.expand-name{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.expand-type{display:inline-block;font-size:11px;color:var(--accent);background:rgba(232,168,62,0.1);padding:1px 7px;border-radius:20px;margin-bottom:4px;}
.expand-why{display:block;font-size:12px;color:var(--text2);line-height:1.4;}
.expand-loading{font-size:12px;color:var(--text3);padding:8px;text-align:center;}

/* TIPS */
.panel-section{margin:12px 16px;}
.tip-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.tip-state{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;}
.tip-list{padding-left:16px;display:flex;flex-direction:column;gap:5px;}
.tip-list li{font-size:13px;color:var(--text2);line-height:1.4;}
.panel-toggle{width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:2px;}
.hidden{display:none;}
</style>
</head>

  {state:"New England (RI / CT)",tips:["Newport traffic is very heavy on summer weekends — arrive early","Clam chowder is the local speciality — try it at a shack, not a tourist restaurant","Speed limits are strictly enforced in Connecticut"]},
  {state:"Ohio",tips:["Amish communities near Berlin/Millersburg: drive slowly, horse & buggies share the road","Do not photograph Amish people without permission","Ohio has speed cameras — observe limits carefully","Some areas are cash-only for small businesses"]},
  {state:"Kentucky",tips:["Bardstown: minimum age for distillery tours is 21 — carry ID","Some rural Kentucky counties are 'dry' — check before assuming alcohol is sold","BBQ here often means mutton, not just pork — try it!"]},
  {state:"Tennessee",tips:["Nashville honky-tonks on Broadway are free entry — tip the bands generously","Tennessee whiskey ≠ bourbon technically, but Jack Daniel's is just down the road","Hot chicken is the local speciality — Prince's or Hattie B's are legendary","Friendly locals — a smile and a chat go a long way"]}
];

let currentView = 'today';
let expandedDay = null;
let poiLoaded = {};
let eventsLoaded = {};

function getTodayIndex() {
  const today = new Date().toISOString().split('T')[0];
  const idx = TRIP.findIndex(d => d.date === today);
  return idx >= 0 ? idx : 0;
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-tab').forEach((t,i) => {
    t.classList.toggle('active', ['today','all','tips'][i] === v);
  });
  document.getElementById('viewToday').classList.toggle('hidden', v !== 'today');
  document.getElementById('viewAll').classList.toggle('hidden', v !== 'all');
  document.getElementById('viewTips').classList.toggle('hidden', v !== 'tips');
  if (v === 'tips' && !document.getElementById('viewTips').dataset.built) buildTips();
  if (v === 'all' && !document.getElementById('viewAll').dataset.built) buildAllDays();
}

function toggleDay(dayNum) {
  expandedDay = expandedDay === dayNum ? null : dayNum;
  renderCurrentView();
  if (expandedDay !== null) {
    const el = document.getElementById('daycard-' + dayNum);
    if (el) setTimeout(() => el.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}

function renderCurrentView() {
  if (currentView === 'today') buildToday();
  else if (currentView === 'all') buildAllDays();
}

async function fetchWeather(city, state, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '<div class="weather-loading">🌤 Loading weather…</div>';
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:500,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:`Current weather for ${city}, ${state}. Return ONLY JSON no backticks: {"temp_f":number,"condition":"string","humidity":number,"wind_mph":number,"high_f":number,"low_f":number}`}]
      })
    });
    const data = await res.json();
    const text = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || '';
    const w = JSON.parse(text.replace(/```json|```/g,'').trim());
    const tC = Math.round((w.temp_f-32)*5/9);
    const hiC = Math.round((w.high_f-32)*5/9);
    const loC = Math.round((w.low_f-32)*5/9);
    el.innerHTML = `
      <div class="weather-widget">
        <div class="weather-main"><span class="weather-temp">${w.temp_f}°F / ${tC}°C</span><span class="weather-cond">${w.condition}</span></div>
        <div class="weather-details"><span>↑${w.high_f}°F/${hiC}°C</span><span>↓${w.low_f}°F/${loC}°C</span><span>💧${w.humidity}%</span><span>💨${w.wind_mph}mph</span></div>
      </div>`;
  } catch(e) { el.innerHTML = '<div class="weather-loading">Weather unavailable</div>'; }
}

async function fetchTraffic(day, containerId) {
  const el = document.getElementById(containerId);
  if (!el || !day.driving) return;
  el.innerHTML = '<div class="traffic-widget">🚦 Checking traffic…</div>';
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:300,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:`Any significant traffic incidents or road closures heading to ${day.city}, ${day.state} today ${day.disp}? Return ONLY JSON no backticks: {"status":"clear","message":"brief summary"}`}]
      })
    });
    const data = await res.json();
    const text = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || '';
    const t = JSON.parse(text.replace(/```json|```/g,'').trim());
    const color = t.status==='major'?'#ff4444':t.status==='minor'?'#ffaa00':'#44cc88';
    el.innerHTML = `<div class="traffic-widget" style="border-left-color:${color}"><span>🚦</span><span>${t.message}</span></div>`;
  } catch(e) { el.innerHTML = '<div class="traffic-widget">🚦 Traffic info unavailable</div>'; }
}

async function loadPOI(day, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (poiLoaded[day.day]) { el.innerHTML = poiLoaded[day.day]; return; }
  el.innerHTML = '<div class="expand-loading">📍 Finding nearby highlights…</div>';
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:600,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:`Top 5 points of interest near ${day.city}, ${day.state} for a road tripper. Return ONLY JSON array no backticks: [{"name":"string","type":"string","why":"one sentence"}]`}]
      })
    });
    const data = await res.json();
    const text = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || '';
    const pois = JSON.parse(text.replace(/```json|```/g,'').trim());
    const html = '<div class="expand-list">'+pois.map(p=>`<div class="expand-item"><span class="expand-name">${p.name}</span><span class="expand-type">${p.type}</span><span class="expand-why">${p.why}</span></div>`).join('')+'</div>';
    poiLoaded[day.day] = html;
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="expand-loading">Could not load POIs</div>'; }
}

async function loadEvents(day, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (eventsLoaded[day.day]) { el.innerHTML = eventsLoaded[day.day]; return; }
  el.innerHTML = '<div class="expand-loading">🎉 Checking local events…</div>';
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:500,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:`Notable local events or festivals near ${day.city}, ${day.state} around ${day.date}? Return ONLY JSON array no backticks: [{"event":"string","date":"string","notes":"string"}]. Return [] if none.`}]
      })
    });
    const data = await res.json();
    const text = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || '';
    const evts = JSON.parse(text.replace(/```json|```/g,'').trim());
    const html = evts.length === 0
      ? '<div class="expand-loading">No major events found for this date.</div>'
      : '<div class="expand-list">'+evts.map(e=>`<div class="expand-item"><span class="expand-name">${e.event}</span><span class="expand-type">${e.date}</span><span class="expand-why">${e.notes}</span></div>`).join('')+'</div>';
    eventsLoaded[day.day] = html;
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="expand-loading">Could not load events</div>'; }
}

function buildDayCardHTML(day, isExpanded) {
  const isAlert = !!day.isAlert;
  let expanded = '';
  if (isExpanded) {
    expanded = `<div class="day-expanded">
      <div id="wx-${day.day}"><div class="weather-loading">🌤 Loading weather…</div></div>
      ${day.driving ? `<div id="tr-${day.day}"><div class="traffic-widget">🚦 Checking traffic…</div></div>` : ''}
      <div class="info-grid">
        ${day.driving && day.details ? `<div class="info-block drive"><div class="info-label">🛣️ Drive</div><div class="info-value">${day.details}</div></div>` : ''}
        <div class="info-block stay">
          <div class="info-label">🏨 Staying At</div>
          <div class="info-value bold">${day.stayName}</div>
          <div class="info-value small">${day.stayAddr}</div>
          <div class="info-ref">Ref: ${day.ref}</div>
        </div>
        ${day.notes ? `<div class="info-block notes-block"><div class="info-label">📝 Notes</div><div class="info-value">${day.notes}</div></div>` : ''}
        ${day.fuel ? `<div class="info-block fuel"><div class="info-label">⛽ Fuel Alert</div><div class="info-value">${day.fuel}</div></div>` : ''}
        ${day.tip ? `<div class="info-block suggestion"><div class="info-label">💡 Trip Tip</div><div class="info-value">${day.tip}</div></div>` : ''}
      </div>
      ${day.map ? `<a href="${day.map}" target="_blank" class="map-link">🗺️ Open Route in Maps</a>` : ''}
      <div>
        <button class="expand-btn" onclick="togglePOI(${day.day})">📍 Points of Interest near ${day.city}</button>
        <div id="poi-${day.day}" class="hidden"></div>
      </div>
      <div>
        <button class="expand-btn" style="margin-top:6px" onclick="toggleEvents(${day.day})">🎉 Check Local Events</button>
        <div id="evt-${day.day}" class="hidden"></div>
      </div>
    </div>`;
  }
  return `<div id="daycard-${day.day}" class="day-card${isExpanded?' active':''}${isAlert?' alert-card':''}" onclick="toggleDay(${day.day})">
    <div class="day-header">
      <div class="day-number">Day ${day.day}</div>
      <div class="day-date-label">${day.disp}</div>
      ${day.driving ? '<div class="driving-badge">🚗 Driving</div>' : ''}
      ${isAlert ? '<div class="alert-badge">⚠️ Action Needed</div>' : ''}
    </div>
    <div class="day-city">${day.city}</div>
    <div class="day-activity-text">${day.activity}</div>
    ${expanded}
  </div>`;
}

function buildToday() {
  const todayIdx = getTodayIndex();
  const today = TRIP[todayIdx];
  const upcoming = TRIP.slice(todayIdx+1, todayIdx+4);
  const isExp = expandedDay === today.day;

  let html = `
    <div class="today-hero">
      <div class="today-label">Today — Day ${today.day}</div>
      <div class="today-city">${today.city}</div>
      <div class="today-date">${today.disp}</div>
      <div class="today-activity">${today.activity}</div>
      <div id="hero-wx"><div class="weather-loading">🌤 Loading weather…</div></div>
      ${today.driving ? '<div id="hero-tr" style="margin-top:8px"><div class="traffic-widget">🚦 Checking traffic…</div></div>' : ''}
    </div>
    <div class="days-list">${buildDayCardHTML(today, isExp)}</div>
    <div class="section-header">Coming Up Next</div>
    <div class="days-list">${upcoming.map(d => buildDayCardHTML(d, expandedDay===d.day)).join('')}</div>`;

  document.getElementById('viewToday').innerHTML = html;
  fetchWeather(today.city, today.state, 'hero-wx');
  if (today.driving) fetchTraffic(today, 'hero-tr');
  if (isExp) {
    fetchWeather(today.city, today.state, 'wx-'+today.day);
    if (today.driving) fetchTraffic(today, 'tr-'+today.day);
  }
}

function buildAllDays() {
  const html = '<div class="section-header">Full 22-Day Itinerary</div><div class="days-list">'
    + TRIP.map(d => buildDayCardHTML(d, expandedDay===d.day)).join('')
    + '</div>';
  document.getElementById('viewAll').innerHTML = html;
  document.getElementById('viewAll').dataset.built = '1';
  if (expandedDay) {
    const d = TRIP.find(x=>x.day===expandedDay);
    if (d) {
      fetchWeather(d.city, d.state, 'wx-'+d.day);
      if (d.driving) fetchTraffic(d, 'tr-'+d.day);
    }
  }
}

function buildTips() {
  const tips = CULTURAL_TIPS.map(t=>`
    <div class="tip-block">
      <div class="tip-state">${t.state}</div>
      <ul class="tip-list">${t.tips.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>`).join('');

  document.getElementById('viewTips').innerHTML = `
    <div class="panel-section">
      <button class="panel-toggle" onclick="toggleSection('cult')">🌍 Cultural & Safety Tips ▼</button>
      <div id="cult">${tips}</div>
    </div>
    <div class="panel-section">
      <div class="tip-block">
        <div class="tip-state">⛽ Fuel Planning</div>
        <ul class="tip-list">
          ${TRIP.filter(d=>d.fuel).map(d=>`<li>Day ${d.day} (${d.disp}): ${d.fuel}</li>`).join('')}
        </ul>
      </div>
    </div>
    <div class="panel-section">
      <div class="tip-block">
        <div class="tip-state">🚗 Hire Car Details</div>
        <ul class="tip-list">
          <li>Ford Explorer — 7 Passengers</li>
          <li>Avis Conf No: 04251600US3</li>
          <li>Hola Booking Conf: HOLA10041826</li>
          <li>Total: $1,976.90 paid + $334 at drop off</li>
          <li>Pickup: Newark Airport — Drop off: Nashville Airport</li>
        </ul>
      </div>
    </div>
    <div class="panel-section">
      <div class="tip-block">
        <div class="tip-state">✈️ Flights</div>
        <ul class="tip-list">
          <li>Out: BA0189 LHR T5 → Newark. 10 Jun, 16:35 → 19:25. Ref: ZZ6WVN | Seats: 40K</li>
          <li>Return: BA0222 Nashville → LHR T3. 8 Jul, 20:40 → 10:50 (9 Jul). Ref: ZZZ6WVN | Seats: 50K</li>
        </ul>
      </div>
    </div>
    <div class="panel-section">
      <div class="tip-block">
        <div class="tip-state">💡 Trip Tips by Day</div>
        <ul class="tip-list">
          ${TRIP.filter(d=>d.tip).map(d=>`<li><strong>Day ${d.day}:</strong> ${d.tip}</li>`).join('')}
        </ul>
      </div>
    </div>`;
  document.getElementById('viewTips').dataset.built = '1';
}

function toggleSection(id) {
  document.getElementById(id).classList.toggle('hidden');
}

function togglePOI(dayNum) {
  const el = document.getElementById('poi-'+dayNum);
  const isHidden = el.classList.contains('hidden');
  el.classList.toggle('hidden');
  if (isHidden) {
    const day = TRIP.find(d=>d.day===dayNum);
    loadPOI(day, 'poi-'+dayNum);
  }
}

function toggleEvents(dayNum) {
  const el = document.getElementById('evt-'+dayNum);
  const isHidden = el.classList.contains('hidden');
  el.classList.toggle('hidden');
  if (isHidden) {
    const day = TRIP.find(d=>d.day===dayNum);
    loadEvents(day, 'evt-'+dayNum);
  }
}

// Check alerts
const hasAlert = TRIP.some(d=>d.isAlert);
if (hasAlert) {
  document.getElementById('alertDot').style.display = 'block';
  document.getElementById('alertsPanel').classList.remove('hidden');
}

// Init
buildToday();
</script>
