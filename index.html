*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c26;--surface2:#1e2332;--border:#2a3040;
  --accent:#e8a83e;--accent2:#5b9cf0;--green:#44cc88;--red:#ff5555;--amber:#ffaa44;
  --text:#e8ecf4;--text2:#8a95a8;--text3:#5a6478;--radius:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%;}
#app{max-width:480px;margin:0 auto;padding:0 0 90px;}
.app-header{background:linear-gradient(160deg,#1a1f2e 0%,#0f1117 100%);padding:env(safe-area-inset-top,16px) 20px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.header-inner{padding:16px 0 0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.app-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--accent);letter-spacing:-0.5px;}
.app-subtitle{font-size:12px;color:var(--text2);font-weight:300;margin-bottom:12px;}
.alert-dot{background:var(--red);color:white;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.nav-tabs{display:flex;gap:4px;padding:0 0 12px;}
.nav-tab{flex:1;padding:9px 4px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;background:var(--surface2);color:var(--text2);}
.nav-tab.active{background:var(--accent);color:#0f1117;font-weight:600;}
.overview-strip{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;gap:8px;}
.ov-item{display:flex;flex-direction:column;align-items:center;min-width:fit-content;}
.ov-num{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--accent);}
.ov-label{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
.ov-divider{width:1px;height:28px;background:var(--border);flex-shrink:0;}
.alerts-panel{margin:12px 16px;background:rgba(255,85,85,0.06);border:1px solid rgba(255,85,85,0.25);border-radius:var(--radius);padding:14px;}
.alerts-title{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.alert-item{font-size:13px;color:var(--text2);padding:4px 0;border-bottom:1px solid rgba(255,85,85,0.1);}
.alert-item:last-child{border-bottom:none;}
.today-hero{margin:16px 16px 0;background:linear-gradient(135deg,#1e2640 0%,#182030 100%);border:1px solid #2a3550;border-radius:18px;padding:20px;position:relative;overflow:hidden;}
.today-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(232,168,62,0.12) 0%,transparent 70%);}
.today-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px;}
.today-city{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--text);line-height:1.1;margin-bottom:4px;}
.today-date-label{font-size:13px;color:var(--text2);margin-bottom:10px;}
.today-activity{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:14px;}
.section-header{padding:16px 20px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.days-list{padding:10px 16px;display:flex;flex-direction:column;gap:10px;}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color 0.2s;}
.day-card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(232,168,62,0.2);}
.day-card.alert-card{border-color:var(--red);}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.day-number{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;}
.day-date-label{font-size:12px;color:var(--text2);}
.driving-badge{font-size:11px;background:rgba(91,156,240,0.15);color:var(--accent2);padding:2px 8px;border-radius:20px;margin-left:auto;}
.alert-badge{font-size:11px;background:rgba(255,85,85,0.15);color:var(--red);padding:2px 8px;border-radius:20px;}
.day-city{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;}
.day-activity-text{font-size:13px;color:var(--text2);line-height:1.4;}
.day-expanded{margin-top:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.weather-widget{background:rgba(91,156,240,0.08);border:1px solid rgba(91,156,240,0.2);border-radius:10px;padding:12px 14px;}
.weather-main{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.weather-temp{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--accent2);}
.weather-cond{font-size:13px;color:var(--text2);}
.weather-details{display:flex;gap:12px;font-size:12px;color:var(--text3);flex-wrap:wrap;}
.weather-loading{font-size:12px;color:var(--text3);padding:10px;background:rgba(91,156,240,0.05);border:1px solid rgba(91,156,240,0.1);border-radius:8px;text-align:center;}
.traffic-widget{background:var(--surface2);border-left:3px solid var(--green);border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);}
.info-grid{display:flex;flex-direction:column;gap:8px;}
.info-block{background:var(--surface2);border-radius:10px;padding:12px;}
.info-block.drive{border-left:3px solid var(--accent2);}
.info-block.stay{border-left:3px solid var(--accent);}
.info-block.notes-block{border-left:3px solid #7c5cbf;}
.info-block.fuel{border-left:3px solid var(--amber);}
.info-block.suggestion{border-left:3px solid var(--green);}
.info-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:5px;}
.info-value{font-size:13px;color:var(--text);line-height:1.5;}
.info-value.bold{font-weight:600;color:var(--accent);}
.info-value.small{font-size:12px;color:var(--text2);margin-top:2px;}
.info-ref{font-size:11px;color:var(--text3);margin-top:4px;font-family:monospace;}
.map-link{display:block;text-align:center;padding:10px;background:rgba(91,156,240,0.1);border:1px solid rgba(91,156,240,0.25);color:var(--accent2);border-radius:10px;font-size:13px;font-weight:500;text-decoration:none;margin-top:2px;}
.expand-btn{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-align:left;margin-top:4px;}
.expand-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.expand-item{background:var(--surface2);border-radius:8px;padding:10px 12px;}
.expand-name{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.expand-type{display:inline-block;font-size:11px;color:var(--accent);background:rgba(232,168,62,0.1);padding:1px 7px;border-radius:20px;margin-bottom:4px;}
.expand-why{display:block;font-size:12px;color:var(--text2);line-height:1.4;}
.expand-loading{font-size:12px;color:var(--text3);padding:8px;text-align:center;}
.panel-section{margin:12px 16px;}
.tip-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.tip-state{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;}
.tip-list{padding-left:16px;display:flex;flex-direction:column;gap:5px;}
.tip-list li{font-size:13px;color:var(--text2);line-height:1.4;}
.hidden{display:none!important;}
</style>

// ── WMO WEATHER CODE MAP ───────────────────────────────────────────────────
const WMO = {0:"☀️ Clear",1:"🌤 Mainly Clear",2:"⛅ Partly Cloudy",3:"☁️ Overcast",
  45:"🌫 Foggy",48:"🌫 Icy Fog",51:"🌦 Light Drizzle",53:"🌦 Drizzle",55:"🌧 Heavy Drizzle",
  61:"🌧 Light Rain",63:"🌧 Rain",65:"🌧 Heavy Rain",71:"🌨 Light Snow",73:"🌨 Snow",
  75:"❄️ Heavy Snow",77:"🌨 Snow Grains",80:"🌦 Light Showers",81:"🌧 Showers",
  82:"⛈ Heavy Showers",85:"🌨 Snow Showers",86:"❄️ Heavy Snow Showers",
  95:"⛈ Thunderstorm",96:"⛈ Thunderstorm & Hail",99:"⛈ Heavy Thunderstorm & Hail"};

// ── STATE ──────────────────────────────────────────────────────────────────
let currentView = 'today';
let expandedDay = null;
const poiCache = {};
const wxCache = {};

function getTodayIndex() {
  const today = new Date().toISOString().split('T')[0];
  const idx = TRIP.findIndex(d => d.date === today);
  return idx >= 0 ? idx : 0;
}

// ── WEATHER via Open-Meteo (free, no key) ─────────────────────────────────
async function fetchWeather(lat, lon, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const cacheKey = `${lat},${lon}`;
  if (wxCache[cacheKey]) { el.innerHTML = wxCache[cacheKey]; return; }
  el.innerHTML = '<div class="weather-loading">🌤 Loading weather…</div>';
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1`;
    const res = await fetch(url);
    const d = await res.json();
    const c = d.current;
    const daily = d.daily;
    const code = c.weather_code;
    const cond = WMO[code] || '🌡 Unknown';
    const hi = Math.round(daily.temperature_2m_max[0]);
    const lo = Math.round(daily.temperature_2m_min[0]);
    const temp = Math.round(c.temperature_2m);
    const feels = Math.round(c.apparent_temperature);
    const hiC = Math.round((hi-32)*5/9);
    const loC = Math.round((lo-32)*5/9);
    const tC = Math.round((temp-32)*5/9);
    const fC = Math.round((feels-32)*5/9);
    const html = `<div class="weather-widget">
      <div class="weather-main"><span class="weather-temp">${temp}°F / ${tC}°C</span><span class="weather-cond">${cond}</span></div>
      <div class="weather-details">
        <span>↑${hi}°F/${hiC}°C</span><span>↓${lo}°F/${loC}°C</span>
        <span>Feels ${feels}°F/${fC}°C</span><span>💧${c.relative_humidity_2m}%</span><span>💨${Math.round(c.wind_speed_10m)}mph</span>
      </div></div>`;
    wxCache[cacheKey] = html;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="weather-loading">Weather unavailable — check connection</div>';
  }
}

async function loadPOI(day, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (poiCache[day.day]) { el.innerHTML = poiCache[day.day]; return; }
  el.innerHTML = '<div class="expand-loading">📍 Loading highlights…</div>';

  const preset = POI_PRESETS[day.city];
  let html;
  if (preset) {
    html = '<div class="expand-list">' + preset.map(p => {
      const parts = p.split(' — ');
      return `<div class="expand-item"><span class="expand-name">${parts[0]}</span>${parts[1] ? `<span class="expand-why">${parts[1]}</span>` : ''}</div>`;
    }).join('') + '</div>';
  } else {
    // Fallback: Nominatim OSM search
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=tourist+attraction+${encodeURIComponent(day.city+' '+day.state)}&format=json&limit=5`, {headers:{'Accept-Language':'en'}});
      const data = await res.json();
      if (data.length) {
        html = '<div class="expand-list">' + data.slice(0,5).map(p=>`<div class="expand-item"><span class="expand-name">${p.display_name.split(',')[0]}</span><span class="expand-type">${p.type}</span></div>`).join('') + '</div>';
      } else {
        html = '<div class="expand-loading">Search Google Maps for things to do in ' + day.city + '</div>';
      }
    } catch(e) {
      html = '<div class="expand-loading">Tap the Maps link above to explore ' + day.city + '</div>';
    }
  }
  poiCache[day.day] = html;
  el.innerHTML = html;
}

// ── TRAFFIC — Google Maps deep link ───────────────────────────────────────
function trafficLink(day) {
  if (!day.driving) return '';
  const dest = encodeURIComponent(day.city + ', ' + day.state);
  const url = `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`;
  return `<a href="${url}" target="_blank" class="map-link">🚦 Check Live Traffic to ${day.city}</a>`;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-tab').forEach((t,i) => {
    t.classList.toggle('active', ['today','all','tips'][i] === v);
  });
  ['viewToday','viewAll','viewTips'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', !id.toLowerCase().includes(v));
  });
  if (v==='tips' && !document.getElementById('viewTips').dataset.built) buildTips();
  if (v==='all' && !document.getElementById('viewAll').dataset.built) buildAllDays();
}

function toggleDay(dayNum) {
  expandedDay = expandedDay === dayNum ? null : dayNum;
  renderCurrentView();
  if (expandedDay) {
    setTimeout(() => {
      const el = document.getElementById('daycard-'+dayNum);
      if (el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
    }, 100);
  }
}

function renderCurrentView() {
  if (currentView==='today') buildToday();
  else if (currentView==='all') buildAllDays();
}

function cardHTML(day, expanded) {
  const isAlert = !!day.isAlert;
  let inner = '';
  if (expanded) {
    inner = `<div class="day-expanded">
      <div id="wx-${day.day}"><div class="weather-loading">🌤 Loading weather…</div></div>
      ${trafficLink(day)}
      <div class="info-grid">
        ${day.driving && day.details ? `<div class="info-block drive"><div class="info-label">🛣️ Drive</div><div class="info-value">${day.details}</div></div>` : ''}
        <div class="info-block stay">
          <div class="info-label">🏨 Staying At</div>
          <div class="info-value bold">${day.stayName}</div>
          <div class="info-value small">${day.stayAddr}</div>
          <div class="info-ref">Ref: ${day.ref}</div>
        </div>
        ${day.notes ? `<div class="info-block notes-block"><div class="info-label">📝 Notes</div><div class="info-value">${day.notes}</div></div>` : ''}
        ${day.fuel ? `<div class="info-block fuel"><div class="info-label">⛽ Fuel Alert</div><div class="info-value">${day.fuel}</div></div>` : ''}
        ${day.tip ? `<div class="info-block suggestion"><div class="info-label">💡 Trip Tip</div><div class="info-value">${day.tip}</div></div>` : ''}
      </div>
      ${day.map ? `<a href="${day.map}" target="_blank" class="map-link">🗺️ Open Route in Maps</a>` : ''}
      <div>
        <button class="expand-btn" onclick="event.stopPropagation();togglePOI(${day.day})">📍 Highlights & Things To Do</button>
        <div id="poi-${day.day}" class="hidden"></div>
      </div>
    </div>`;
  }
  return `<div id="daycard-${day.day}" class="day-card${expanded?' active':''}${isAlert?' alert-card':''}" onclick="toggleDay(${day.day})">
    <div class="day-header">
      <span class="day-number">Day ${day.day}</span>
      <span class="day-date-label">${day.disp}</span>
      ${day.driving?'<span class="driving-badge">🚗 Driving</span>':''}
      ${isAlert?'<span class="alert-badge">⚠️ Action</span>':''}
    </div>
    <div class="day-city">${day.city}</div>
    <div class="day-activity-text">${day.activity}</div>
    ${inner}
  </div>`;
}

function afterRender(day) {
  if (expandedDay === day.day) {
    fetchWeather(day.lat, day.lon, 'wx-'+day.day);
  }
}

function buildToday() {
  const idx = getTodayIndex();
  const today = TRIP[idx];
  const upcoming = TRIP.slice(idx+1, idx+4);
  document.getElementById('viewToday').innerHTML = `
    <div class="today-hero">
      <div class="today-label">Today — Day ${today.day}</div>
      <div class="today-city">${today.city}, ${today.state}</div>
      <div class="today-date-label">${today.disp}</div>
      <div class="today-activity">${today.activity}</div>
      <div id="hero-wx"><div class="weather-loading">🌤 Loading weather…</div></div>
      ${trafficLink(today)}
    </div>
    <div class="days-list">${cardHTML(today, expandedDay===today.day)}</div>
    <div class="section-header">Coming Up Next</div>
    <div class="days-list">${upcoming.map(d=>cardHTML(d, expandedDay===d.day)).join('')}</div>`;
  fetchWeather(today.lat, today.lon, 'hero-wx');
  [today, ...upcoming].forEach(afterRender);
}

function buildAllDays() {
  document.getElementById('viewAll').innerHTML =
    '<div class="section-header">Full 22-Day Itinerary</div><div class="days-list">'
    + TRIP.map(d=>cardHTML(d, expandedDay===d.day)).join('') + '</div>';
  document.getElementById('viewAll').dataset.built = '1';
  TRIP.forEach(afterRender);
}

    </div>`).join('');
  document.getElementById('viewTips').innerHTML = `
    <div class="panel-section"><div class="tip-block"><div class="tip-state">🌍 Cultural & Safety Tips</div>${tipHTML}</div></div>
    <div class="panel-section"><div class="tip-block">
      <div class="tip-state">⛽ Fuel Planning</div>
      <ul class="tip-list">${TRIP.filter(d=>d.fuel).map(d=>`<li><strong>Day ${d.day} (${d.disp}):</strong> ${d.fuel}</li>`).join('')}</ul>
    </div></div>
    <div class="panel-section"><div class="tip-block">
      <div class="tip-state">🚗 Hire Car</div>
      <ul class="tip-list">
        <li>Ford Explorer — 7 Passengers</li>
        <li>Avis Conf No: 04251600US3</li>
        <li>Hola Booking: HOLA10041826</li>
        <li>$1,976.90 paid + $334 at drop off</li>
        <li>Pickup: Newark Airport — Drop off: Nashville Airport</li>
      </ul>
    </div></div>
    <div class="panel-section"><div class="tip-block">
      <div class="tip-state">✈️ Flights</div>
      <ul class="tip-list">
        <li><strong>Out:</strong> BA0189 LHR T5 → Newark. 10 Jun 16:35 → 19:25. Ref: ZZ6WVN | Seats: 40K</li>
        <li><strong>Return:</strong> BA0222 Nashville → LHR T3. 8 Jul 20:40 → 10:50 (9 Jul). Ref: ZZZ6WVN | Seats: 50K</li>
      </ul>
    </div></div>
    <div class="panel-section"><div class="tip-block">
      <div class="tip-state">💡 Trip Tips by Day</div>
      <ul class="tip-list">${TRIP.filter(d=>d.tip).map(d=>`<li><strong>Day ${d.day}:</strong> ${d.tip}</li>`).join('')}</ul>
    </div></div>`;
  document.getElementById('viewTips').dataset.built = '1';
}

function togglePOI(dayNum) {
  const el = document.getElementById('poi-'+dayNum);
  const hiding = !el.classList.contains('hidden');
  el.classList.toggle('hidden');
  if (!hiding) loadPOI(TRIP.find(d=>d.day===dayNum), 'poi-'+dayNum);
}

// ── INIT ───────────────────────────────────────────────────────────────────
buildToday();
</script>
